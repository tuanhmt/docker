; PHP-FPM pool. Loaded after the official image's zz-docker.conf, which
; already sets "listen = 9000" and "clear_env = no" (needed so PHP sees
; DB_HOST and the other container environment variables).

[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
; Enough idle workers to take a burst without waiting for new ones to start.
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500

; max_execution_time (120s) plus a margin. Stops workers that hang in
; I/O, which max_execution_time does not count.
request_terminate_timeout = 150s

php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT}
; The code in a production image never changes, so OPcache does not need to
; check file times. Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 when the code is
; mounted from the host and edited.
php_admin_value[opcache.validate_timestamps] = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
; Disabled for web requests only. CLI tools (drush, artisan) keep them, they need
; proc_open.
php_admin_value[disable_functions] = passthru,shell_exec,system,proc_open,popen,show_source

; The web server in front already logs every request.
access.log = /dev/null
