; Loaded after php.ini-production, for both the fpm and cli images.

date.timezone = UTC
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

max_execution_time = 120
max_input_vars = 1000
upload_max_filesize = 100M
post_max_size = 100M
session.upload_progress.enabled = Off

; CLI limit for CLI tools, cron and Composer. PHP-FPM sets its own limit per
; request, see conf/php-fpm/zz-pool.conf.
memory_limit = 2G

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

apc.shm_size = 64M
